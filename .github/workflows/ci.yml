name: CI

on:
  push:
     branches: [ main ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Python3
       uses: actions/setup-python@v5
       with:
         python-version: "3.11"

     - name: Install depedencies
       run: pip install -r requirements.txt pytest

     - name: Run unit tests
       run: pytest -v

  smoke-test:
     runs-on: ubuntu-latest
     steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Build and start services
       run: docker compose up -d --build

     - name: Smoke test
       run: |
         curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors localhost:5000/notes
         curl -sS --fail -X POST localhost:5000/notes -H "Content-Type: application/json" -d '{"text":"ci smoke test"}'
         curl localhost:5000/notes | grep -q "ci smoke test"

     - name: Show logs on failure
       if: failure()
       run: docker compose logs

  push:
    needs: [unit-test, smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/a-elef93/notes-api:latest
          ghcr.io/a-elef93/notes-api:${{ github.sha }}





